[project]
name = "pidgin"
version = "0.1.0"
description = "AI workforce workspace runtime"
readme = "specs/README.md"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=4.2.0",
    "pydantic>=2.10.0",
    "structlog>=24.4.0",
    "python-ulid>=3.0.0",
    "ruff>=0.8.0",
    "pyright>=1.1.390",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "itsdangerous>=2.2.0",
    "python-multipart>=0.0.12",
    "httpx>=0.28.0",
    "slack-sdk>=3.33.0",
    "pyjwt[crypto]>=2.9.0",
    "annotated-doc>=0.0.4",
    "anthropic>=0.40.0",
    "openai>=1.55.0",
    "websockets>=13.0",
    "pywinpty>=2.0.14; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
pidgin-admin = "pidgin.api.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pidgin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.uv]
# Dropbox/synced folders: hardlinks often fail and corrupt partial installs
link-mode = "copy"
